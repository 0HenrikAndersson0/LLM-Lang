[package]
name = "llm-lang"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The IR library: reader (JS/TS/C# via tree-sitter), expander, canonical printer, JS/C# emitters"
keywords = ["llm", "ir", "codegen", "transpiler", "tree-sitter"]
categories = ["development-tools", "compilers"]

[dependencies]
proptest = { workspace = true }
tree-sitter = "0.27.1"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-typescript = "0.23.2"
